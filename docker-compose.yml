services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    # appendonly keeps the event log on disk so it survives a Redis restart too.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  service:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      REDIS_ADDR: "redis:6379"
      MQTT_BROKER: "tcp://mosquitto:1883"
    depends_on:
      - mosquitto
      - redis

volumes:
  mosquitto-data:
  redis-data:
